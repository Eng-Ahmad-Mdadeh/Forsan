name: forsan
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  intl: ^0.20.2
  lucide_icons_flutter: ^3.1.19
  connectivity_plus: ^7.1.1
  go_router: ^17.2.2
  get_it: ^9.2.1
  injectable: ^3.0.0
  awesome_snackbar_content: ^0.1.8
  flutter_spinkit: ^5.2.2
  lottie: ^3.3.3
  flutter_bloc: ^9.1.1
  animated_custom_dropdown: ^3.1.1
  icons_plus: ^5.0.0
  awesome_dialog: ^3.3.0
  animations: ^2.2.0
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.4
  skeletonizer: ^2.1.3
  video_player: ^2.11.1
  equatable: ^2.0.8
  permission_handler: ^12.0.1
  double_back_to_close_app: ^2.1.0
  json_annotation: ^4.11.0
  json_serializable: ^6.13.2
  dartz: ^0.10.1
  pinput: ^6.0.2
  flutter_timer_countdown: ^1.0.7
  url_launcher: ^6.3.2
  hive_flutter: ^1.1.0
  image_picker: ^1.2.2
  image_cropper: ^12.2.1
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  #  package_info_plus: ^9.0.1
  package_info_plus: ^10.2.0
  local_hero_transform: ^1.0.6
  dotted_border: ^2.1.0
  card_swiper: ^3.0.1
  carousel_slider: ^5.0.0
  flutter_slidable: ^3.1.2
  flutter_widget_from_html: ^0.15.1
  google_maps_flutter: ^2.13.0
  flutter_google_maps_webservices: ^1.1.1
  google_maps_place_picker_mb_v2: ^1.0.1
  place_picker_google: ^0.0.20
  local_auth: ^3.0.1
  firebase_messaging: ^15.1.3
  firebase_core: ^3.6.0
  flutter_local_notifications: ^17.2.2
  country_picker: ^2.0.27


dependency_overrides:
  package_info_plus: ^8.3.0
  webview_flutter_android: ^3.16.9

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  go_router_builder: ^4.3.0
  build_runner: ^2.14.1
  injectable_generator: ^3.0.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/json/
    - assets/fonts/


  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/rubik/Rubik-Light.ttf
          weight: 200
        - asset: assets/fonts/rubik/Rubik-Light.ttf
          weight: 300
        - asset: assets/fonts/rubik/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/rubik/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/rubik/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/rubik/Rubik-Bold.ttf
          weight: 700
        - asset: assets/fonts/rubik/Rubik-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/rubik/Rubik-Black.ttf
          weight: 900

    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 600
        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/tajawal/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/tajawal/Tajawal-Black.ttf
          weight: 900
